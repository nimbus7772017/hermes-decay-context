name: hermes-decay-context
version: 0.1.0
description: >
  Decay context engine (clean eviction + rolling digest instead of lossy
  summarization) plus operator Pins (verbatim short directives that survive
  compaction), wired through public plugin APIs — register_context_engine,
  register_command (/pins /done /park /unpark), and a pre_llm_call inject hook.
  No Hermes core overrides.
author: Nimbus Solutions
requires_hermes: ">=0.10.0"
provides_tools:
  - operator_directive_done
provides_hooks:
  - pre_llm_call
# Enable the engine with: context.engine: decay
